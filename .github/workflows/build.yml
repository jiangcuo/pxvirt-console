name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# a new push cancels the still running build of the same branch; tag (release) builds always finish
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # one job per architecture; static binaries without SDL, linkers in .cargo/config.toml
  linux:
    runs-on: ubuntu-latest
    container: pxvirt/musl:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, arch: x86_64 }
          - { target: aarch64-unknown-linux-musl, arch: aarch64 }
          - { target: riscv64gc-unknown-linux-musl, arch: riscv64 }
          - { target: loongarch64-unknown-linux-musl, arch: loongarch64 }
    env:
      # the toolchain is installed for root, GitHub sets HOME to /github/home
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          . /opt/musl/musl.env
          export PXVIRT_GIT_REV=${GITHUB_SHA::8}
          cargo build --release --locked --no-default-features --target ${{ matrix.target }}
          mkdir out
          cp target/${{ matrix.target }}/release/pxvirt-console out/pxvirt-console-linux-${{ matrix.arch }}
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: pxvirt-console-linux-${{ matrix.arch }}
          path: out/*

  # client only (--ssh / --remote), no SDL
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, arch: arm64 }
          - { target: x86_64-apple-darwin, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          export PXVIRT_GIT_REV=${GITHUB_SHA::8}
          cargo build --release --locked --no-default-features --target ${{ matrix.target }}
          mkdir out
          dir=$(mktemp -d)
          cp target/${{ matrix.target }}/release/pxvirt-console README.md README.zh-CN.md "$dir/"
          (cd "$dir" && zip -X "$GITHUB_WORKSPACE/out/pxvirt-console-macos-${{ matrix.arch }}.zip" pxvirt-console README.md README.zh-CN.md)
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: pxvirt-console-macos-${{ matrix.arch }}
          path: out/*

  release:
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: pxvirt-console-*
          path: out
          merge-multiple: true

      - run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # "What's Changed": one line per pull request, or per commit pushed without one
      - name: Release notes
        run: |
          repo=$GITHUB_REPOSITORY
          url=https://github.com/$repo
          tag=$GITHUB_REF_NAME
          prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          range=${prev:+$prev..}$tag
          declare -A seen
          {
            echo "## What's Changed"
            echo
            for sha in $(git rev-list --reverse --no-merges "$range"); do
              pr=$(gh api "repos/$repo/commits/$sha/pulls" \
                --jq '[.[] | select(.merged_at != null)][0] | select(.) | "\(.number)\t\(.user.login)\t\(.title)"' 2>/dev/null || true)
              if [ -n "$pr" ]; then
                IFS=$'\t' read -r num login title <<< "$pr"
                [ -n "${seen[$num]}" ] && continue
                seen[$num]=1
                echo "* $title by [@$login](https://github.com/$login) in [#$num]($url/pull/$num)"
              else
                login=$(gh api "repos/$repo/commits/$sha" --jq '.author.login // empty' 2>/dev/null || true)
                subject=$(git log -1 --format=%s "$sha")
                if [ -n "$login" ]; then by="[@$login](https://github.com/$login)"; else by=$(git log -1 --format=%an "$sha"); fi
                echo "* $subject by $by in [\`${sha::7}\`]($url/commit/$sha)"
              fi
            done
            echo
            if [ -n "$prev" ]; then
              echo "**Full Changelog**: $url/compare/$prev...$tag"
            else
              echo "**Full Changelog**: $url/commits/$tag"
            fi
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: pxvirt-console ${{ github.ref_name }}
          body_path: notes.md
          files: out/*
