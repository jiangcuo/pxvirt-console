[package]
name = "pxvirt-console"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Pxvirt Direct Console User Interface"
authors = ["lierfang"]

[dependencies]
# TUI framework
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# System info
sysinfo = "0.32"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Password check
pwcheck = "0.2"

# Time
chrono = "0.4"

[profile.release]
opt-level = "z"
lto = true
strip = true

[dev-dependencies]
pwcheck = "0.2"
