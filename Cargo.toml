[package]
name = "pxvirt-console"
version = "0.3.0"
edition = "2021"
build = "build.rs"
description = "Pxvirt Direct Console User Interface"
authors = ["lierfang"]

[workspace]
members = ["raid"]

[features]
default = ["sdl"]
# SDL2 (KMSDRM) graphical VM console on the physical console (tty1).
sdl = ["dep:sdl2", "dep:font8x8"]

[dependencies]
# TUI framework
ratatui = "0.30"
crossterm = "0.29"
ratatui-image = { version = "=11.1.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false }

# Error handling
anyhow = "1.0"

# Serialization / config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# PVE API (HTTPS with fingerprint pinning) and VNC websocket
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
sha2 = "0.10"
base64 = "0.22"
flate2 = "1.0"
des = "0.8"

# Hardware RAID / HBA / NVMe tools
pxvirt-raid = { path = "raid" }

# System
libc = "0.2"
chrono = "0.4"

# Optional graphical console
sdl2 = { version = "0.38", optional = true }
# 8x8 bitmap font for the SDL status bar (no SDL2_ttf dependency)
font8x8 = { version = "0.3", default-features = false, optional = true }

[profile.release]
opt-level = "z"
lto = true
strip = true
